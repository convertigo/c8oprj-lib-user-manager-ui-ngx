↓LoginStyle [ngx.components.UIStyle-1783000000082]: 
  comment: Applies local CSS rules for this block
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.login-shell {
           min-height: 100%;
          }
          .login-container {
           width: 100%;
           max-width: 460px;
           margin: 0 auto;
          }
          .login-card-header {
           text-align: center;
          }
          .login-logo {
           display: block;
           margin: 0 auto 10px auto;
          }
          .login-actions,
          .oauth-actions {
           display: flex;
           flex-direction: column;
           gap: 10px;
           margin-top: 12px;
          }
          .oauth-button {
           width: 100%;
          }
          .login-separator {
           width: 100%;
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 10px;
           margin-top: 18px;
          }
          .login-separator::before,
          .login-separator::after {
           content: "";
           flex: 1 1 auto;
           height: 1px;
           background: var(--ion-color-step-250, #d7d8da);
          }
          .login-separator-text {
           font-size: 0.82rem;
           color: var(--ion-color-medium, #666);
          }
          '
