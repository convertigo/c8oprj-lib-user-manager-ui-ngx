        /*Begin_c8o_CompFunction*/
        	public toggleShowPassword() {
        		this.local = this.local || {};
        		this.local.showPassword = !Boolean(this.local?.showPassword);
        	}
        
        	public toggleShowCreatePassword() {
        		this.local = this.local || {};
        		this.local.showCreatePassword = !Boolean(this.local?.showCreatePassword);
        	}
        
        	public getSignInErrorMessage(out) {
        		try {
        			var error = out?.error;
        			if (error != null) {
        				var code = String(error?.code ?? "");
        				if (code == "2") {
        					return this.translate.instant("bad_id");
        				}
        				if (code == "3") {
        					return this.translate.instant("Please_reset_your_password");
        				}
        				if (code == "4") {
        					return this.translate.instant("Please_confirm_your_account");
        				}
        				if ((error?.message ?? "") != "") {
        					return error.message;
        				}
        			}
        		} catch (e) {
        			this.c8o.log.debug("[LoginComponent] getSignInErrorMessage failed");
        		}
        		return this.translate.instant("error_occured");
        	}
        
        	public getForgotPasswordErrorMessage(out) {
        		try {
        			var error = out?.error;
        			if (error != null) {
        				var code = String(error?.code ?? "");
        				if (code == "2") {
        					return this.translate.instant("Auth_ForgotPassword_Error_Code_2");
        				}
        				if ((error?.message ?? "") != "") {
        					return error.message;
        				}
        				if (code != "") {
        					return this.translate.instant("Auth_ForgotPassword_Error_Unknown") + " (" + code + ")";
        				}
        			}
        		} catch (e) {
        			this.c8o.log.debug("[LoginComponent] getForgotPasswordErrorMessage failed");
        		}
        		return this.translate.instant("Auth_ForgotPassword_Failed");
        	}
        	/*End_c8o_CompFunction*/
        
