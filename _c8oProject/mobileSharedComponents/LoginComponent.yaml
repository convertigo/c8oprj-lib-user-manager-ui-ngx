        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		this.local = this.local || {};
        		this.local.showPassword = false;
        		this.local.showCreatePassword = false;
        		this.local.showCreateAccount = false;
        		this.local.showForgotPassword = false;
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
