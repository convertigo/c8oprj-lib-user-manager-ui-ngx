comment: |
  Handles access control and redirection based on the user's authentication status and the page they are attempting to access.
  
  This shared action should be invoked from an AppGuard component.
  
  <ins>Behavior:</ins>
  
  
   - If the user is **not authenticated** and tries to access a page listed in `authorizedPagesOnlyWithAuthentication`, they will be redirected to `unauthenticatedAccessRedirectPage`.
   - If the user is **authenticated** and tries to access a page listed in `authorizedPagesOnlyWithoutAuthentication`, they will be redirected to `authenticatedAccessRedirectPage`.
   - If the current page is not restricted based on the user's authentication status, no redirection occurs.
↓authorizedPagesOnlyWithoutAuthentication [ngx.components.UIStackVariable-1738934331004]: 
  comment: 'Type: Array of String | Specifies the list of pages that are only accessible to users who are **not** authenticated. These pages should be hidden or restricted once the user is logged in (e.g., login or registration pages).'
  value: '[]'
↓authorizedPagesOnlyWithAuthentication [ngx.components.UIStackVariable-1738934446548]: 
  comment: 'Type: Array of String | Specifies the list of pages that are only accessible to authenticated users. These pages should not be available to users who are not logged in (e.g., dashboard or profile pages).'
  value: '[]'
↓unauthenticatedAccessRedirectPage [ngx.components.UIStackVariable-1738934569301]: 
  comment: 'Type: String | Specifies the page to redirect users to when they attempt to access a restricted page without being authenticated. (e.g., dashboard or profile pages).'
↓authenticatedAccessRedirectPage [ngx.components.UIStackVariable-1738934712277]: 
  comment: 'Type: String | Specifies the page to redirect users to when they attempt to access a page that should not be accessible after they have already logged in (e.g., login or registration pages).'
↓InvokeSharedAction [ngx.components.UIDynamicInvoke-1738935398540]: 
  beanData: '{"ionBean":"InvokeAction"}'
  stack: lib_UserManager_ui_ngx.MobileApplication.Application.isAuthenticatedSession
  ↓routePages [ngx.components.UICustomAsyncAction-1738935482556]: 
    actionValue: 
      - xmlizable: 
        - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
        - com.twinsoft.convertigo.beans.common.FormatedContent: 
          →: |
            		try {
            			let pageName = event.pageName;
            			let isLoggedOn = props.parent.out;
            			if(vars.authorizedPagesOnlyWithoutAuthentication instanceof Array && vars.authorizedPagesOnlyWithoutAuthentication.indexOf(pageName) != -1){
            				if(isLoggedOn){
            					page.routerProvider.setRoot(vars.authenticatedAccessRedirectPage, null, null);
            					return false;
            				}
            				else{
            					return true;
            				}
            			}
            			else if(vars.authorizedPagesOnlyWithAuthentication instanceof Array && vars.authorizedPagesOnlyWithAuthentication.indexOf(pageName) != -1){
            				if(isLoggedOn){
            					return true;
            				}
            				else{
            					page.routerProvider.setRoot(vars.unauthenticatedAccessRedirectPage, null, null);
            					return false;
            				}
            			}
            			
            		} catch (e) {
            			console.error("error", e);
            			return true;
            		}
            
