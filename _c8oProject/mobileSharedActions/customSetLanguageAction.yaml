          					page.global[globalProperty] =
          						selectedLanguage;
          				}
          
          
          				/*
          				 * Helper used by language selectors
          				 */
          
          				page.global.getLanguageLabelKey =
          					function(inputLanguage: any): string {
          
          						var lang =
          							normalizeLang(inputLanguage);
          
          						if (lang == "") {
          							var current =
          								page.global[globalProperty];
          
          							if (
          								typeof current === "function"
          							) {
          								try {
          									lang =
          										normalizeLang(current());
          								}
          								catch (e) {
          								}
          							}
          							else {
          								lang =
          									normalizeLang(current);
          							}
          						}
          
          						if (lang == "") {
          							lang = fallbackLanguage;
          						}
          
          						return resolveLanguageLabelKey(
          							lang
          						);
          					};
          			}
          
          
          			resolve({
          				lang: selectedLanguage,
          				fallback: fallbackLanguage,
          				supportedLanguages: supportedLanguages
          			});
          		}
          		catch (e) {
          			reject(e);
          		}
