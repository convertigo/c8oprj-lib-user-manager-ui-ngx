comment: |
  Returns the callback URLs of the OAuth sign-ins (lib_OAuth pages getToken.html, getTokenGoogle.html, getTokenLinkedIn.html) for the OAuth actions of an application (js/oauth_callback_url.js).
  
  By default they are the pages of https://c8ocloud.convertigo.net/convertigo, the callback registered on the OAuth applications of Convertigo. The symbol lib_oauth.callback.base_url (a Convertigo base URL, as https://forms.example.com/convertigo) replaces it for a server that uses OAuth applications of its own.
  
  Called once by the page that shows the sign-in buttons (LoginComponent), whose OAuth actions listen to its answer: microsoft, openid, google, linkedin.
↓Callbacks [steps.SimpleStep-1799810000001]: 
  comment: The callbacks of the symbol lib_oauth.callback.base_url when it is set, else of c8ocloud; an invalid symbol is ignored and logged.
