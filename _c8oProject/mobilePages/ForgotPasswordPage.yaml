        /*Begin_c8o_PageConstructor*/
                let requestedLanguage = this.navParams?.data?.lang;
                try {
                    if (!requestedLanguage && typeof window !== ''undefined'') {
                        requestedLanguage = new URLSearchParams(window.location.search).get(''lang'');
                    }
                } catch (e) {
                    requestedLanguage = '''';
                }
                if (requestedLanguage) {
                    const normalizeLocale = this.global?.normalizeUserManagerLocale;
                    const normalizedLanguage = typeof normalizeLocale === ''function''
                        ? normalizeLocale(requestedLanguage)
                        : ''en'';
                    this.translate.use(normalizedLanguage);
                    try {
                        window.localStorage.setItem(''c8o-lang'', normalizedLanguage);
                    } catch (e) {
                        // Storage can be unavailable in privacy-restricted environments.
                    }
                }
                /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
            /*End_c8o_PageFunction*/
